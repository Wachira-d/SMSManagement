name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release /warnaserror

      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Verify EF migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet ef migrations script --project SMSManagement -o /tmp/init.sql
          test -s /tmp/init.sql

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        # Build only — don't push. Pushing belongs in a release workflow with proper secrets.
        run: docker build -t campaign-platform:${{ github.sha }} .
