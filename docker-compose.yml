# Local development stack.
#
# Brings up:
#   1) SQL Server 2022 (developer edition)         on  :11433
#   2) The campaign platform API                   on  :8080
#
# First-run setup:
#   $ cp .env.example .env       # then edit the secrets
#   $ docker compose up --build
#
# Migrations are applied at app startup automatically (see Program.cs).
# Hangfire's own schema is created by Hangfire on first connect.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campaign-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
    ports:
      - "11433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The image ships sqlcmd at /opt/mssql-tools18/bin (with TLS by default).
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campaign-api
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # Connection string — runtime composes it from the sibling MSSQL_SA_PASSWORD.
      ConnectionStrings__Default: "Server=mssql,1433;Database=campaign;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;Encrypt=true;"

      # ----- Secrets (loaded from .env; in production from KMS, never committed) -----
      Encryption__DataKeyBase64: "${ENCRYPTION_DATA_KEY_BASE64}"
      Shortlink__IpHashSaltBase64: "${SHORTLINK_IP_SALT_BASE64}"
      UserCacheAuth__PasswordSalt: "${USERCACHE_PASSWORD_SALT}"
      Auth__LocalJwt__SigningKeyBase64: "${JWT_SIGNING_KEY_BASE64}"

      # ----- AuthenAPI -----
      AuthenApi__BaseUrl: "${AUTHEN_API_BASEURL:-}"
      AuthenApi__ApiKey: "${AUTHEN_API_KEY:-}"

      # ----- SMS providers -----
      Sms__Providers__Etracker__Username: "${ETRACKER_USERNAME:-}"
      Sms__Providers__Etracker__Password: "${ETRACKER_PASSWORD:-}"
      Sms__Providers__Infobip__BaseUrl:  "${INFOBIP_BASEURL:-}"
      Sms__Providers__Infobip__ApiKey:   "${INFOBIP_APIKEY:-}"
    ports:
      - "8080:8080"
    volumes:
      - api-keys:/var/app/keys
    restart: unless-stopped

volumes:
  mssql-data:
  api-keys:
